# 店舗ごとの設定。ID類は Secrets ではなく設定値なのでここに記載する。
# ig_user_id : Instagram ビジネス/クリエイターアカウントの数値ID
# gbp_location: "locations/<ID>" 形式 (Business Profile API)
# 各店舗のInstagramトークンは環境変数 (token_env) から読む。
locations:
  - key: shinjuku
    name: 煙仄 新宿店
    ig_username: ""            # TODO: 記入
    ig_user_id: ""             # TODO: 記入
    ig_token_env: IG_TOKEN_SHINJUKU
    gbp_location: ""           # TODO: 例 locations/1234567890
    cta_url: ""                # 任意: 投稿ボタンのリンク先(予約ページ等)
    seo:                       # 出典: 検索結果に出ていた公式サイト/ホットペッパーの記載 (要確認)
      area: "新宿"
      nearby: "南新宿駅から徒歩4分、新宿駅から徒歩10分"
      category: "シーシャカフェ&バー"
      keywords: ["新宿 シーシャ", "南新宿 シーシャ", "代々木 シーシャ", "新宿 水タバコ"]
      features: ["閑静な住宅街の2階", "14:00〜23:00営業"]
  - key: ikebukuro
    name: 煙仄2nd 池袋店
    ig_username: shisha_kemurihonoka2nd
    ig_user_id: ""             # TODO: 記入
    ig_token_env: IG_TOKEN_IKEBUKURO
    gbp_location: ""           # TODO: 例 locations/0987654321
    cta_url: ""
    seo:                       # 出典: 検索結果に出ていた公式サイト/ホットペッパー等の記載 (要確認)
      area: "池袋"
      nearby: "池袋駅西口から徒歩4分"
      category: "シーシャカフェ&バー"
      keywords: ["池袋 シーシャ", "池袋 水タバコ", "池袋 シーシャ ボードゲーム"]
      features: ["路面店の広い店内", "60種類以上のフレーバー", "ボードゲーム・麻雀・アート", "14:00〜23:00営業"]

settings:
  max_posts_per_run: 1         # 1店舗あたり1回の実行で投稿する最大件数
  lookback_posts: 10           # Instagramから取得する直近件数
  max_age_days: 14             # これより古い投稿は対象外
  post_cta: LEARN_MORE         # BOOK / ORDER / LEARN_MORE / CALL など
  upload_media_to_gallery: true  # 写真・動画をGBPの写真タブにも登録する
  rewrite_with_claude: true    # ClaudeがMEO/SEO向けに投稿文を作成 (ANTHROPIC_API_KEY必要。無ければテンプレで代替)
  tone: ""                    # TODO: 店の口調 例 "落ち着いた大人の雰囲気、丁寧語"

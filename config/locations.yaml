# 店舗ごとの設定。ID類は Secrets ではなく設定値なのでここに記載する。
# ig_user_id : Instagram ビジネス/クリエイターアカウントの数値ID
# gbp_location: "locations/<ID>" 形式 (Business Profile API)
# 各店舗のInstagramトークンは環境変数 (token_env) から読む。
locations:
  - key: shinjuku
    name: 煙仄 新宿本店
    ig_username: shisha_kemurihonoka   # 公式サイトのリンクで確認済み
    ig_user_id: ""             # TODO: 記入
    ig_token_env: IG_TOKEN_SHINJUKU
    gbp_location: ""           # TODO: 例 locations/1234567890
    cta_url: "https://kemuri-honoka.com/"   # 投稿ボタンのリンク先
    tone: "落ち着いた大人の雰囲気の丁寧語。夜を静かに過ごす、代々木の路地のシーシャ、という空気感。誇張しない"
    seo:                       # 出典: kemuri-honoka.com (2026-09時点)
      area: "新宿"
      nearby: "新宿駅から徒歩10分、南新宿駅から徒歩4分、代々木駅から徒歩8分"
      category: "シーシャカフェ&バー"
      keywords: ["新宿 シーシャ", "代々木 シーシャ", "南新宿 シーシャ", "新宿 シーシャ 深夜"]
      features:
        - "初心者・おひとり様歓迎。好みに合わせてスタッフがフレーバーを提案"
        - "金・土は翌4:30まで営業 (月〜木・日は14:00〜23:00)"
        - "アートや植物に囲まれた落ち着いた店内、代々木の静かな立地"
        - "15〜20名程度の貸切に対応 (2日前までに要予約)"
        - "お酒からソフトドリンクまで種類豊富"
  - key: ikebukuro
    name: 煙仄2nd 池袋店
    ig_username: shisha_kemurihonoka2nd  # 公式サイトのリンクで確認済み
    ig_user_id: ""             # TODO: 記入
    ig_token_env: IG_TOKEN_IKEBUKURO
    gbp_location: ""           # TODO: 例 locations/0987654321
    cta_url: "https://kemuri-honoka.com/"
    tone: "喫茶店のような穏やかさと少し遊び心。丁寧語で親しみやすく、静かなatelierのような空間を伝える"
    seo:                       # 出典: kemuri-honoka.com (2026-09時点)
      area: "池袋"
      nearby: "池袋駅西口・2a出口から徒歩約4分"
      category: "シーシャカフェ&バー"
      keywords: ["池袋 シーシャ", "池袋西口 シーシャ", "池袋 シーシャ ボードゲーム", "池袋 シーシャ 麻雀"]
      features:
        - "池袋西口の落ち着いた立地、グレー基調のatelierのような店内"
        - "60種以上のフレーバー、季節のブレンド"
        - "名物はメロンクリームソーダ、オーナー手作りの数量限定の固めプリン"
        - "麻雀卓・ボードゲームを常設"
        - "20〜30名程度の貸切に対応 (2日前までに要予約)"
        - "14:00〜23:00 年中無休、ご予約優先"

settings:
  max_posts_per_run: 1         # 1店舗あたり1回の実行で投稿する最大件数
  lookback_posts: 10           # Instagramから取得する直近件数
  max_age_days: 14             # これより古い投稿は対象外
  post_cta: LEARN_MORE         # BOOK / ORDER / LEARN_MORE / CALL など
  upload_media_to_gallery: true  # 写真・動画をGBPの写真タブにも登録する
  rewrite_with_claude: true    # ClaudeがMEO/SEO向けに投稿文を作成 (ANTHROPIC_API_KEY必要。無ければテンプレで代替)
  tone: "丁寧で親しみやすい"     # 店舗側にtoneがあればそちらを優先

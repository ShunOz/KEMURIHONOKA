name: GBP sync
on:
  schedule:
    - cron: "0 1 * * *"   # 毎日 10:00 JST
  workflow_dispatch:
    inputs:
      apply:
        description: "実際に投稿する (false でドライラン)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: gbp-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Sync
        env:
          IG_TOKEN_SHINJUKU: ${{ secrets.IG_TOKEN_SHINJUKU }}
          IG_TOKEN_IKEBUKURO: ${{ secrets.IG_TOKEN_IKEBUKURO }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT: ${{ secrets.GBP_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python -m gbp_sync.main --apply
          else
            python -m gbp_sync.main
          fi
      - name: Commit state
        run: |
          git config user.name "gbp-sync-bot"
          git config user.email "gbp-sync-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "chore: update posted state" && git push)

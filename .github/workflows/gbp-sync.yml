name: GBP sync
on:
  schedule:
    - cron: "0 1 * * *"   # 毎日 10:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run=確認のみ / manual=素材+Issue作成 / api=GBP APIで自動投稿"
        type: choice
        options: [dry-run, manual, api]
        default: manual
env:
  MODE: ${{ inputs.mode || 'manual' }}   # 定期実行は manual。API承認後は api に変更
permissions:
  contents: write
  issues: write
concurrency: gbp-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Sync
        env:
          IG_TOKEN_SHINJUKU: ${{ secrets.IG_TOKEN_SHINJUKU }}
          IG_TOKEN_IKEBUKURO: ${{ secrets.IG_TOKEN_IKEBUKURO }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT: ${{ secrets.GBP_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m gbp_sync.main --mode "$MODE"
      - name: Upload materials
        if: ${{ !cancelled() && hashFiles('out/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gbp-post-materials
          path: out/
          retention-days: 90
      - name: Commit state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "gbp-sync-bot"
          git config user.email "gbp-sync-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "chore: update posted state" && git push)
